<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1960 720" data-base-width="1960" data-base-height="720" role="group" aria-label="数据流 · 操作形成记录，分析结果交给谁"><title>数据流 · 操作形成记录，分析结果交给谁</title><desc>箭头表示数据内容。上面的工作动作在这里形成记录；分析结果分送业务决策与绩效复核。</desc><style>.flow-node{cursor:pointer}.flow-node.is-muted{opacity:.32}.flow-node.is-selected>rect{stroke-width:5}.flow-node:focus-visible>rect{stroke-width:5}.node-dept{font:600 17px "PingFang SC","Microsoft YaHei",sans-serif}.node-id{font:13px monospace;fill:#64748b}.node-role{font:17px "PingFang SC","Microsoft YaHei",sans-serif;fill:#475569}.node-action{font:650 22px "PingFang SC","Microsoft YaHei",sans-serif;fill:#1e293b}.node-copy{font:17px "PingFang SC","Microsoft YaHei",sans-serif;fill:#475569}.node-small{font:15px "PingFang SC","Microsoft YaHei",sans-serif;fill:#64748b}.edge-label{font:15px "PingFang SC","Microsoft YaHei",sans-serif;fill:#334155}.flow-edge>path{fill:none;stroke:#64748b;stroke-width:2.2}.flow-edge.exception>path{stroke:#a16207;stroke-dasharray:8 5}.flow-edge.return>path{stroke:#a16207;stroke-dasharray:7 6}</style><defs><marker id="arrow-merchandising-data" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9Z" fill="#64748b"/></marker><pattern id="grid-merchandising-data" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#dce3ed"/></pattern></defs><rect x="-4000" y="-4000" width="10000" height="10000" fill="url(#grid-merchandising-data)"/><g class="flow-edge normal"><path d="M355,160.0 H427.5 V317.5 H500" marker-end="url(#arrow-merchandising-data)"/><rect x="359.5" y="146.75" width="136" height="75" rx="5" fill="#fff" fill-opacity=".96"/><text x="427.5" y="167.75" text-anchor="middle" class="edge-label">源主键 / 数量</text><text x="427.5" y="189.75" text-anchor="middle" class="edge-label">状态 /</text><text x="427.5" y="211.75" text-anchor="middle" class="edge-label">截至时点</text></g><g class="flow-edge normal"><path d="M355,475.0 H427.5 V317.5 H500" marker-end="url(#arrow-merchandising-data)"/><rect x="359.5" y="304.25" width="136" height="75" rx="5" fill="#fff" fill-opacity=".96"/><text x="427.5" y="325.25" text-anchor="middle" class="edge-label">任务 / 交接</text><text x="427.5" y="347.25" text-anchor="middle" class="edge-label">验收 / 工时</text><text x="427.5" y="369.25" text-anchor="middle" class="edge-label">/ 说明</text></g><g class="flow-edge normal"><path d="M840,317.5 H915.0 V317.5 H990" marker-end="url(#arrow-merchandising-data)"/><rect x="847.0" y="225.5" width="136" height="75" rx="5" fill="#fff" fill-opacity=".96"/><text x="915.0" y="246.5" text-anchor="middle" class="edge-label">可核算数据</text><text x="915.0" y="268.5" text-anchor="middle" class="edge-label">适用范围 /</text><text x="915.0" y="290.5" text-anchor="middle" class="edge-label">规则</text></g><g class="flow-edge normal"><path d="M1330,317.5 H1410.0 V165.0 H1490" marker-end="url(#arrow-merchandising-data)"/><rect x="1342.0" y="149.25" width="136" height="75" rx="5" fill="#fff" fill-opacity=".96"/><text x="1410.0" y="170.25" text-anchor="middle" class="edge-label">指标 + 证据</text><text x="1410.0" y="192.25" text-anchor="middle" class="edge-label">原因假设 /</text><text x="1410.0" y="214.25" text-anchor="middle" class="edge-label">策略</text></g><g class="flow-edge normal"><path d="M1330,317.5 H1410.0 V492.5 H1490" marker-end="url(#arrow-merchandising-data)"/><rect x="1342.0" y="313.0" width="136" height="75" rx="5" fill="#fff" fill-opacity=".96"/><text x="1410.0" y="334.0" text-anchor="middle" class="edge-label">履职证据 +</text><text x="1410.0" y="356.0" text-anchor="middle" class="edge-label">背景</text><text x="1410.0" y="378.0" text-anchor="middle" class="edge-label">待复核资料</text></g><g class="flow-node" role="button" tabindex="0" data-node="D1" data-refs="source" data-info="{&quot;title&quot;: &quot;商陆花业务事实&quot;, &quot;who&quot;: &quot;商陆花API数据来源&quot;, &quot;operations&quot;: &quot;查 / 商陆花 / 商品、销售/退货、库存、门店；成本另获授权；增 / 改 / 飞书 / 企划假设、版本、评审、地区映射与反馈；归档 / 更正 /