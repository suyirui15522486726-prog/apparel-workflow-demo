" rx="9" fill="#f0f9ff" stroke="#0369a1" stroke-width="1.6"/><path d="M510,197 H830" stroke="#0369a1" stroke-width="5"/><text x="518" y="229" fill="#0369a1" class="node-dept">商品部</text><text x="822" y="228" text-anchor="end" class="node-id">D3</text><text class="node-action" x="518" y="270">关联与校验</text><text class="node-copy" x="518" y="313">业务ID / SKU / 批次</text><text class="node-copy" x="518" y="338">人员 / 时间 / 单位</text><text class="node-copy" x="518" y="363">有效状态 / 规则版本</text><text class="node-copy" x="518" y="388">缺失或错配先补证</text></g><g class="flow-node" role="button" tabindex="0" data-node="D4" data-refs="analysis" data-info="{&quot;title&quot;: &quot;指标计算与eval&quot;, &quot;who&quot;: &quot;部门口径负责人 / 分析服务&quot;, &quot;operations&quot;: &quot;先用确定规则计算；检查范围、分母、误报漏报与证据，AI辅助解释。&quot;, &quot;refs&quot;: &quot;analysis&quot;, &quot;id&quot;: &quot;D4&quot;}" aria-label="部门口径负责人 / 分析服务：指标计算与eval"><title>先用确定规则计算；检查范围、分母、误报漏报与证据，AI辅助解释。</title><rect x="990" y="195" width="340" height="245" rx="9" fill="#f0f9ff" stroke="#0369a1" stroke-width="1.6"/><path d="M1000,197 H1320" stroke="#0369a1" stroke-width="5"/><text x="1008" y="229" fill="#0369a1" class="node-dept">商品部</text><text x="1312" y="228" text-anchor="end" class="node-id">D4</text><text class="node-action" x="1008" y="270">指标计算与eval</text><text class="node-copy" x="1008" y="313">同批净销、库存、毛利及企划偏差</text><text class="node-copy" x="1008" y="338">规则计算 + 人工样本核验</text></g><g class="flow-node" role="button" tabindex="0" data-node="D5" data-refs="decision" data-info="{&quot;title&quot;: &quot;交给业务负责人&quot;, &quot;who&quot;: &quot;商品负责人 / 设计与销售负责人&quot;, &quot;operations&quot;: &quot;收到指标、源证据、待验证原因及建议备选；由负责人决定并登记行动。&quot;, &quot;refs&quot;: &quot;decision&quot;, &quot;id&quot;: &quot;D5&quot;}" aria-label="商品负责人 / 设计与销售负责人：交给业务负责人"><title>收到指标、源证据、待验证原因及建议备选；由负责人决定并登记行动。</title><rect x="1490" y="40" width="440" height="250" rx="9" fill="#f0f9ff" stroke="#0369a1" stroke-width="1.6"/><path d="M1500,42 H1920" stroke="#0369a1" st